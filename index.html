<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Mengobrol</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 { color: #38bdf8; }

    p { color: #cbd5e1; line-height: 1.6; }

    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
    }

    #status {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Ruang Mengobrol</h1>
    <p>Tempat ngobrol bersama teman secara realtime.</p>

    <p id="status">Menghubungkan ke Supabase...</p>

    <button onclick="testConnection()">
      Tes Koneksi Database
    </button>
  </div>

  <script>
    // KONFIGURASI SUPABASE
    const SUPABASE_URL =
      "https://mtkojgwrcppxhoaudqze.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IepBmSaRF_0CwQSOGn4Anw_gd3KHLE5";

    // MEMBUAT KONEKSI
    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusElement = document.getElementById("status");

    // TES KONEKSI DATABASE
    async function testConnection() {
      statusElement.textContent = "Sedang mengetes koneksi...";

      try {
        const { data, error } = await db
          .from("rooms")
          .select("id")
          .limit(1);

        if (error) {
          statusElement.textContent =
            "Koneksi/API merespons, tetapi query gagal: " +
            error.message;
          console.error(error);
          return;
        }

        statusElement.textContent =
          "Berhasil! Database Supabase terhubung.";

      } catch (error) {
        statusElement.textContent =
          "Gagal terhubung: " + error.message;
        console.error(error);
      }
    }

    // TES OTOMATIS SAAT HALAMAN DIBUKA
    testConnection();
  </script>

</body>
</html>
