<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Mengobrol</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ruang Mengobrol</h1>
    <p>Tempat ngobrol bersama teman secara realtime.</p>
    <p id="status">Aplikasi sedang disiapkan...</p>
    <button onclick="alert('Selamat datang di Ruang Mengobrol!')">
      Mulai Mengobrol
    </button>
  </div>

</body>
</html>
